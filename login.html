
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgendaZap</title>
    <link rel="stylesheet" href="style.css">
    <style>.hidden{display:none!important}</style>
</head>
<body>
    <main class="login-container">
        <div class="login-box">
            <div class="login-logo">📅</div>

            <h1>AgendaZap</h1>

            <p class="login-subtitulo" id="subtitulo">
                Acesso do administrador
            </p>

            <form id="loginForm">
                <div id="businessNameWrap" class="hidden">
                    <label for="businessName">Nome do estabelecimento</label>
                    <input type="text" id="businessName" maxlength="100" placeholder="Ex.: Barbearia do João">
                </div>
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >

                <button
                    type="submit"
                    class="btn-primary login-btn"
                    id="btnEnviar"
                >
                    Entrar
                </button>
            </form>

            <p id="mensagemLogin" class="mensagem-login" aria-live="polite"></p>

            <p style="text-align:center; margin-top:18px;">
                <span id="textoAlternativo">Ainda não tem conta?</span>
                <button
                    type="button"
                    id="btnAlternar"
                    style="border:0; background:none; color:#16803c; font-weight:bold; cursor:pointer; padding:6px;"
                >
                    Criar conta
                </button>
            </p>

            <a href="index.html" class="voltar-site">
                ← Voltar para o site
            </a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js?v=20261015-7"></script>
</body>
</html>
